_format_version: "2.1"
_transform: true

###
# Gateway minimo para o Livre Acesso self-hosted.
# Expoe somente Auth (GoTrue) e PostgREST — Storage, Realtime, Functions,
# Studio e Analytics do stack oficial do Supabase nao sao usados pela API
# e ficam desligados em docker-compose.override.yml.
###

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          credentials: false
          headers:
            - Accept
            - Authorization
            - Content-Type
            - apikey
            - X-Request-ID
          methods:
            - GET
            - POST
            - OPTIONS

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          credentials: false
          headers:
            - Accept
            - Authorization
            - Content-Type
            - apikey
            - X-Request-ID
            - Accept-Profile
            - Content-Profile
          methods:
            - GET
            - POST
            - OPTIONS
