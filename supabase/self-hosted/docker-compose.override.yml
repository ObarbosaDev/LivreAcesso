###
# Override aplicado sobre o docker-compose.yml oficial do Supabase
# (github.com/supabase/supabase, pasta docker/) para a VM gratuita da Oracle.
#
# Uso (a partir da raiz do repositorio, depois que scripts/setup_oracle_vm.sh
# tiver clonado o stack oficial em .supabase-stack/):
#
#   docker compose -p livreacesso \
#     -f .supabase-stack/docker-compose.yml \
#     -f supabase/self-hosted/docker-compose.override.yml \
#     -f docker-compose.oracle.yml \
#     --env-file .supabase-stack/.env \
#     up -d db auth rest kong caddy api communication-worker frontend
#
# Studio, Storage, Realtime, Functions, Meta, Analytics, Vector e Supavisor
# do stack oficial nao entram na lista acima: a API so fala com Auth e
# PostgREST, e manter esses servicos fora reduz a VM gratuita exposta.
###

services:
  kong:
    volumes:
      - ../../supabase/self-hosted/kong.yml:/home/kong/temp.yml:ro
    ports:
      - "8000"

  auth:
    restart: unless-stopped

  rest:
    restart: unless-stopped

  db:
    restart: unless-stopped
    volumes:
      - livreacesso-db-data:/var/lib/postgresql/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?defina APP_DOMAIN}"
      API_DOMAIN: "${API_DOMAIN:?defina API_DOMAIN}"
      GATEWAY_DOMAIN: "${GATEWAY_DOMAIN:?defina GATEWAY_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL:?defina ACME_EMAIL}"
    volumes:
      - ../../supabase/self-hosted/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - kong

volumes:
  livreacesso-db-data:
  caddy-data:
  caddy-config:
