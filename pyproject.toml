[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "livre-acesso"
version = "0.1.0"
description = "Plataforma de gestão de alunos, turmas e frequência do Instituto Livre Acesso."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "HumaniTec" }]
dependencies = [
    "email-validator==2.3.0",
    "fastapi==0.158.1",
    "httpx2==2.16.0",
    "pydantic==2.14.1",
    "PyJWT[crypto]==2.15.1",
    "uvicorn==0.54.0",
]

[project.scripts]
livre-acesso-verify-supabase = "scripts.verify_supabase_auth:main"

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pglast==8.7",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["backend"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
